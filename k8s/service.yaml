apiVersion: v1
kind: Service
metadata:
  name: qwelli-service
  namespace: qwelli
  labels:
    app: qwelli
  annotations:
    # Azure Load Balancer annotations
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/health"
spec:
  type: LoadBalancer
  selector:
    app: qwelli
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
  sessionAffinity: ClientIP  # Sticky sessions for better UX
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours
---
# Internal service for pod-to-pod communication
apiVersion: v1
kind: Service
metadata:
  name: qwelli-internal
  namespace: qwelli
  labels:
    app: qwelli
spec:
  type: ClusterIP
  selector:
    app: qwelli
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
