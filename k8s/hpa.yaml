# Horizontal Pod Autoscaler - automatically scale based on metrics
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: qwelli-hpa
  namespace: qwelli
  labels:
    app: qwelli
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qwelli
  minReplicas: 2    # Minimum for high availability
  maxReplicas: 10   # Scale up to 10 pods under heavy load
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
        - type: Percent
          value: 50  # Scale down max 50% of pods at a time
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
        - type: Percent
          value: 100  # Double pods at a time if needed
          periodSeconds: 60
        - type: Pods
          value: 2  # Or add 2 pods at a time
          periodSeconds: 60
      selectPolicy: Max  # Use the policy that scales up the most
  metrics:
    # Scale based on CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70  # Target 70% CPU usage
    # Scale based on memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80  # Target 80% memory usage
