apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwelli
  namespace: qwelli
  labels:
    app: qwelli
    version: v1
spec:
  # Start with 2 replicas for high availability
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Ensure zero downtime
  selector:
    matchLabels:
      app: qwelli
  template:
    metadata:
      labels:
        app: qwelli
        version: v1
        azure.workload.identity/use: "true"  # Enable workload identity
    spec:
      serviceAccountName: qwelli-sa

      # Node affinity - prefer application nodes
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - application

        # Pod anti-affinity - spread across nodes for HA
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - qwelli
                topologyKey: kubernetes.io/hostname

      containers:
        - name: qwelli
          image: ${ACR_LOGIN_SERVER}/qwelli:latest  # Replace with your ACR
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # Environment variables from ConfigMap
          envFrom:
            - configMapRef:
                name: qwelli-config

          # Sensitive environment variables from secrets
          env:
            - name: DB_HOST
              value: "${POSTGRES_FQDN}"  # Replace with terraform output
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qwelli-secrets
                  key: db-password
            - name: QWELLI_EMBEDDING_KEY
              valueFrom:
                secretKeyRef:
                  name: qwelli-secrets
                  key: voyage-api-key

          # Resource requests and limits
          resources:
            requests:
              cpu: 500m      # 0.5 CPU core
              memory: 1Gi    # 1 GB RAM
            limits:
              cpu: 2000m     # 2 CPU cores max
              memory: 4Gi    # 4 GB RAM max

          # Liveness probe - restart if unhealthy
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          # Readiness probe - don't send traffic if not ready
          readinessProbe:
            httpGet:
              path: /ready
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3

          # Startup probe - for slow-starting apps
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 12  # 60 seconds to start

          # Security context
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          # Mount secrets from Key Vault
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true

      # Volumes
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "qwelli-secrets"

      # Security settings for the pod
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      # DNS policy
      dnsPolicy: ClusterFirst

      # Restart policy
      restartPolicy: Always

      # Termination grace period
      terminationGracePeriodSeconds: 30
