# Secret Provider Class for Azure Key Vault integration
# This uses workload identity to securely fetch secrets from Key Vault
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: qwelli-secrets
  namespace: qwelli
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "${POD_IDENTITY_CLIENT_ID}"  # Replace with output from terraform
    keyvaultName: "${KEY_VAULT_NAME}"      # Replace with output from terraform
    cloudName: "AzurePublicCloud"
    tenantId: "${TENANT_ID}"                # Replace with output from terraform
    objects: |
      array:
        - |
          objectName: db-password
          objectType: secret
          objectVersion: ""
        - |
          objectName: voyage-api-key
          objectType: secret
          objectVersion: ""
  secretObjects:
    - secretName: qwelli-secrets
      type: Opaque
      data:
        - objectName: db-password
          key: db-password
        - objectName: voyage-api-key
          key: voyage-api-key
